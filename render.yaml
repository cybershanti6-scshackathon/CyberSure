# Render Blueprint — CYBERSURE single-service full-stack deployment
#
# ONE service serves BOTH the FastAPI backend (/api/v1/...) and the
# compiled React frontend (/). No cross-origin requests, no CORS friction,
# no second service to manage.
#
# How it works:
#   build.sh  → npm ci + npm run build → dist/
#             → pip install backend deps
#   uvicorn   → FastAPI serves /api/v1/* from Python code
#             → FastAPI serves /*      from dist/ (static files)
#
# Usage: New → Blueprint → connect repo → Apply

services:
  - type: web
    name: cybersure
    runtime: python
    # Build from repo root so both package.json and backend/ are accessible
    rootDir: .
    buildCommand: bash build.sh
    # Run uvicorn from the backend/ directory so `app.main` resolves correctly.
    # dist/ sits at ../dist relative to backend/ — main.py computes the path
    # from __file__ so it works wherever uvicorn is invoked from.
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20"
      # Frontend and backend are on the SAME origin — the browser never sends
      # an Origin header for same-origin requests, so CORS is not needed in
      # production. The loopback regex in config.py still covers local dev.
      # No CYBERSURE_CORS_ORIGINS needed here.
